[package]
name = "ectropy"
description = "Structural and vocabulary law for source repositories."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ectropy"
path = "src/main.rs"

[dependencies]
plumb = { version = "0.37.4", registry = "perish", features = ["skill"] }
kernel = { path = "../kernel" }
grammar = { path = "../grammar" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
