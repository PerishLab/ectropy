name: guard
# depot-sync/v1

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container:
      image: git.perish.top/perishfire/images/forge@sha256:3bc746c0428576eb47c1ece051f2dfa6f6016094be6565977268f76dc1f269a0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Plumb
        run: |
          set -eu
          curl -fsSL https://releases.plumb.perish.uk/manage.sh | sh
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync the Plumb depot
        run: |
          set -eu
          plumb depot sync

      - name: Guard rust
        run: |
          set -eu
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets --release

      - name: Guard test
        run: |
          set -eu
          cargo test --locked

      - name: Guard plumb
        run: |
          set -eu
          plumb doctor .

      - name: Guard ectropy
        run: |
          set -eu
          cargo run --quiet --locked --bin ectropy -- .

