name: release-stable

on:
  workflow_dispatch:
    inputs:
      verify_version:
        description: "Replay public smoke for one exact immutable stable version"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ectropy-release-stable
  cancel-in-progress: false

jobs:
  metadata:
    if: ${{ inputs.verify_version == '' }}
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    env:
      ECTROPY_RELEASES_PUBLIC_URL: ${{ vars.ECTROPY_RELEASES_PUBLIC_URL }}
      ECTROPY_RELEASES_S3_AK: ${{ secrets.ECTROPY_RELEASES_S3_AK }}
      ECTROPY_RELEASES_S3_BUCKET: ${{ secrets.ECTROPY_RELEASES_S3_BUCKET }}
      ECTROPY_RELEASES_S3_SK: ${{ secrets.ECTROPY_RELEASES_S3_SK }}
      ECTROPY_RELEASES_S3_URL: ${{ secrets.ECTROPY_RELEASES_S3_URL }}
      R2_ACCESS_PROBE_NAME: release-stable
      RELEASE_CHANNEL: stable
    outputs:
      base_version: ${{ steps.stable.outputs.base_version }}
      release_version: ${{ steps.stable.outputs.release_version }}
      state_source: ${{ steps.stable.outputs.state_source }}
      put_linux: ${{ steps.presign.outputs.put_linux }}
      put_darwin: ${{ steps.presign.outputs.put_darwin }}
      put_windows: ${{ steps.presign.outputs.put_windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate R2 access
        run: bash .forgejo/scripts/release/r2/check.sh

      - name: Resolve stable metadata
        id: stable
        run: deno run --allow-env --allow-read --allow-net --allow-write="$GITHUB_OUTPUT" .forgejo/scripts/release/metadata/stable.ts

      - name: Guard
        run: |
          set -eu
          deno run \
            --allow-read \
            --allow-write \
            --allow-env \
            --allow-net \
            --allow-run \
            --config .runseal/deno.json \
            --lock .runseal/deno.lock \
            --frozen=true \
            .runseal/wrappers/guard.ts

      - name: Refuse immutable overwrite
        env:
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: bash .forgejo/scripts/release/r2/absent.sh

      - name: Presign
        id: presign
        env:
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: deno run --allow-env --allow-write="$GITHUB_OUTPUT" .forgejo/scripts/release/r2/presign.ts

  deliver-linux:
    needs: metadata
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
    outputs:
      sha: ${{ steps.digest.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Package
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          set -eu
          sh .forgejo/scripts/release/assets/package.sh "$RELEASE_VERSION"

      - name: Digest
        id: digest
        run: |
          set -eu
          echo "sha=$(sha256sum "dist/$RELEASE_VERSION/ectropy-x86_64-unknown-linux-gnu.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deliver
        env:
          PUT_URL: ${{ needs.metadata.outputs.put_linux }}
        run: |
          set -eu
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 -T "dist/$RELEASE_VERSION/ectropy-x86_64-unknown-linux-gnu.tar.gz" -H 'Cache-Control: no-store' "$PUT_URL"

  deliver-macos:
    needs: metadata
    runs-on: macos
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
    outputs:
      sha: ${{ steps.digest.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Package
        env:
          TARGET: aarch64-apple-darwin
        run: |
          set -eu
          sh .forgejo/scripts/release/assets/package.sh "$RELEASE_VERSION"

      - name: Digest
        id: digest
        run: |
          set -eu
          echo "sha=$(shasum -a 256 "dist/$RELEASE_VERSION/ectropy-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deliver
        env:
          PUT_URL: ${{ needs.metadata.outputs.put_darwin }}
        run: |
          set -eu
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 -T "dist/$RELEASE_VERSION/ectropy-aarch64-apple-darwin.tar.gz" -H 'Cache-Control: no-store' "$PUT_URL"

  deliver-windows:
    needs: metadata
    runs-on: windows
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
    outputs:
      sha: ${{ steps.digest.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Package
        run: pwsh -NoProfile -File .forgejo/scripts/release/assets/package.ps1 "${{ needs.metadata.outputs.release_version }}"

      - name: Digest
        id: digest
        run: |
          "sha=$((Get-FileHash "dist/$env:RELEASE_VERSION/ectropy-x86_64-pc-windows-msvc.zip" -Algorithm SHA256).Hash.ToLower())" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Deliver
        env:
          PUT_URL: ${{ needs.metadata.outputs.put_windows }}
        run: |
          curl.exe -fsS --retry 3 --retry-all-errors --retry-delay 2 -T "dist/$env:RELEASE_VERSION/ectropy-x86_64-pc-windows-msvc.zip" -H "Cache-Control: no-store" "$env:PUT_URL"
          if ($LASTEXITCODE -ne 0) { throw "deliver failed: $LASTEXITCODE" }

  seal:
    needs: [metadata, deliver-linux, deliver-macos, deliver-windows]
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    env:
      CI_COMMIT: ${{ github.sha }}
      CI_REPOSITORY: ${{ github.repository }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_WORKFLOW: release-stable
      ECTROPY_RELEASES_PUBLIC_URL: ${{ vars.ECTROPY_RELEASES_PUBLIC_URL }}
      ECTROPY_RELEASES_S3_AK: ${{ secrets.ECTROPY_RELEASES_S3_AK }}
      ECTROPY_RELEASES_S3_BUCKET: ${{ secrets.ECTROPY_RELEASES_S3_BUCKET }}
      ECTROPY_RELEASES_S3_SK: ${{ secrets.ECTROPY_RELEASES_S3_SK }}
      ECTROPY_RELEASES_S3_URL: ${{ secrets.ECTROPY_RELEASES_S3_URL }}
      RELEASE_CHANNEL: stable
      RELEASE_ROOT: dist/${{ needs.metadata.outputs.release_version }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch delivered bytes
        run: |
          set -eu
          mkdir -p "$RELEASE_ROOT"
          for name in ectropy-x86_64-unknown-linux-gnu.tar.gz ectropy-aarch64-apple-darwin.tar.gz ectropy-x86_64-pc-windows-msvc.zip; do
            AWS_ACCESS_KEY_ID="$ECTROPY_RELEASES_S3_AK" \
            AWS_SECRET_ACCESS_KEY="$ECTROPY_RELEASES_S3_SK" \
            AWS_DEFAULT_REGION=auto \
            AWS_EC2_METADATA_DISABLED=true \
            aws --endpoint-url "${ECTROPY_RELEASES_S3_URL%/}" s3api get-object \
              --bucket "$ECTROPY_RELEASES_S3_BUCKET" \
              --key "$RELEASE_CHANNEL/versions/$RELEASE_VERSION/$name" \
              --no-cli-pager "$RELEASE_ROOT/$name" >/dev/null
          done

      - name: Attest digests
        env:
          SHA_DARWIN: ${{ needs.deliver-macos.outputs.sha }}
          SHA_LINUX: ${{ needs.deliver-linux.outputs.sha }}
          SHA_WINDOWS: ${{ needs.deliver-windows.outputs.sha }}
        run: |
          set -eu
          for pair in \
            "ectropy-x86_64-unknown-linux-gnu.tar.gz:$SHA_LINUX" \
            "ectropy-aarch64-apple-darwin.tar.gz:$SHA_DARWIN" \
            "ectropy-x86_64-pc-windows-msvc.zip:$SHA_WINDOWS"; do
            name=${pair%%:*}
            want=${pair#*:}
            got=$(sha256sum "$RELEASE_ROOT/$name" | cut -d' ' -f1)
            [ -n "$want" ] || { printf 'missing delivered digest for %s\n' "$name" >&2; exit 1; }
            [ "$got" = "$want" ] || { printf 'digest drift on %s: %s != %s\n' "$name" "$got" "$want" >&2; exit 1; }
          done

      - name: Publish
        env:
          BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
          STATE_SOURCE: ${{ needs.metadata.outputs.state_source }}
        run: |
          set -eu
          export GUARD_VERSION_HASH="$(deno run --allow-read --allow-run --allow-env --allow-net --config .runseal/deno.json --lock .runseal/deno.lock --frozen=true .runseal/wrappers/guard.ts version-hash)"
          sh .forgejo/scripts/release/assets/checksums.sh "$RELEASE_VERSION" "$RELEASE_ROOT"
          sh .forgejo/scripts/release/assets/verify.sh accept "$RELEASE_VERSION" "$RELEASE_ROOT"
          sh .forgejo/scripts/release/assets/verify.sh verify "$RELEASE_VERSION" "$RELEASE_ROOT"
          bash .forgejo/scripts/release/r2/publish.sh

      - name: Verify R2 publish
        env:
          R2_METADATA_URL: ${{ vars.ECTROPY_RELEASES_PUBLIC_URL }}/stable/latest/metadata.json
        run: bash .forgejo/scripts/release/r2/verify.sh

      - name: Publish summary
        env:
          BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
          R2_METADATA_URL: ${{ vars.ECTROPY_RELEASES_PUBLIC_URL }}/stable/latest/metadata.json
          R2_VERSION_METADATA_URL: ${{ vars.ECTROPY_RELEASES_PUBLIC_URL }}/stable/versions/${{ needs.metadata.outputs.release_version }}/metadata.json
          R2_VERSION_PREFIX: stable/versions/${{ needs.metadata.outputs.release_version }}
          STATE_SOURCE: ${{ needs.metadata.outputs.state_source }}
        run: bash .forgejo/scripts/release/r2/summary.sh

  smoke-linux:
    if: ${{ always() && (needs.seal.result == 'success' || inputs.verify_version != '') }}
    needs: [metadata, seal]
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    env:
      ECTROPY_RELEASES_PUBLIC_URL: ${{ vars.ECTROPY_RELEASES_PUBLIC_URL }}
      RELEASE_VERSION: ${{ inputs.verify_version || needs.metadata.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Wait for public propagation
        run: sleep 30

      - name: Public smoke
        run: sh .forgejo/scripts/release/smoke/smoke.sh "$RELEASE_VERSION" stable

  smoke-macos:
    if: ${{ always() && (needs.seal.result == 'success' || inputs.verify_version != '') }}
    needs: [metadata, seal]
    runs-on: macos
    env:
      ECTROPY_RELEASES_PUBLIC_URL: ${{ vars.ECTROPY_RELEASES_PUBLIC_URL }}
      RELEASE_VERSION: ${{ inputs.verify_version || needs.metadata.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Wait for public propagation
        run: sleep 30

      - name: Public smoke
        run: sh .forgejo/scripts/release/smoke/smoke.sh "$RELEASE_VERSION" stable

  smoke-windows:
    if: ${{ always() && (needs.seal.result == 'success' || inputs.verify_version != '') }}
    needs: [metadata, seal]
    runs-on: windows
    env:
      ECTROPY_RELEASES_PUBLIC_URL: ${{ vars.ECTROPY_RELEASES_PUBLIC_URL }}
      RELEASE_VERSION: ${{ inputs.verify_version || needs.metadata.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Wait for public propagation
        run: Start-Sleep -Seconds 30

      - name: Public smoke
        run: pwsh -NoProfile -File .forgejo/scripts/release/smoke/smoke.ps1 "$env:RELEASE_VERSION" stable

  finalize:
    if: ${{ inputs.verify_version == '' }}
    needs: [metadata, seal, smoke-linux, smoke-macos, smoke-windows]
    permissions:
      contents: write
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Tag release
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            printf 'tag %s already exists on origin\n' "$RELEASE_VERSION" >&2
            exit 1
          fi
          git config user.name "forgejo-actions"
          git config user.email "actions@git.perish.top"
          git tag -a "$RELEASE_VERSION" -m "$RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"
