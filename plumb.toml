[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The CLI, kernel, and grammar Rust workspace members."

[[layout.seat]]
path = "charts/*"
kind = "retired"
note = "This product ships no Helm chart; the tombstone keeps the domain seat absent."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = [".gitattributes"]
note = "Git attribute policy."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[[layout.file]]
name = ["DESIGN.md"]
note = "The admitted structure-tree and adapter contract."

[release]
product = "ectropy"
authority = "https://releases.ectropy.perish.uk"
binaries = ["ectropy"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
skill = true
