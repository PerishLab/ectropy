[scan]
include = [
  "crates/**/*.rs",
  "docs/**/*.md",
  "skills/**/*.md",
]
exclude = [
  "**/target/**",
]

[module]
roots = [
  "crates/*/src",
  "crates/*/tests",
  "docs",
  "skills/*",
]

[limit]
block = 4
path = 4
file = 300
fanout = 10
markup = 8
param = 4
combination = 3

[comment]
allow = false

[word]
single = true

[[grant]]
syntax = "test"
paths = ["crates/*/tests/**/*.rs"]

[[grant]]
syntax = "environment"
paths = ["crates/*/tests/**/*.rs"]

[[boundary]]
paths = [".forgejo/**"]
note = "release product glue is platform-specific ci infrastructure"
allow = ["path", "comment"]

[vocabulary]
