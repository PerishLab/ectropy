[comment]
allow = false

[[grant]]
paths = [
    "crates/*/src/**/*.rs",
    "crates/*/tests/**/*.rs",
]
syntax = "test"

[[grant]]
paths = ["crates/*/tests/**/*.rs"]
syntax = "environment"

[[grant]]
paths = [
    "crates/cli/src/cookbook.rs",
    "crates/grammar/src/rules.rs",
]
syntax = "embed"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3
schema = 2
tuple = 3

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
]

[scan]
exclude = ["**/target/**"]
include = [
    "crates/**/*.rs",
]

[vocabulary]

[[vocabulary.term]]
description = "the indentation projection consumed by grammar rules"
name = "layout"

[[vocabulary.term]]
description = "the Python source language adapter"
name = "python"

[[vocabulary.term]]
description = "one ordered field in a positional product"
name = "position"

[[vocabulary.term]]
description = "one named member of a record schema"
name = "field"

[[vocabulary.term]]
description = "a named product declaration"
name = "record"

[[vocabulary.term]]
description = "the identity carried by named structural evidence"
name = "label"

[[vocabulary.term]]
description = "an exact set of record field names"
name = "schema"

[[vocabulary.term]]
description = "an anonymous positional product"
name = "tuple"

[word]
single = true
