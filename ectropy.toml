[[boundary]]
allow = [
    "path",
    "comment",
]
note = "release product glue is platform-specific ci infrastructure"
paths = [".forgejo/**"]

[comment]
allow = false

[[grant]]
paths = ["crates/*/tests/**/*.rs"]
syntax = "test"

[[grant]]
paths = ["crates/*/tests/**/*.rs"]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
    "docs",
    "skills/*",
]

[scan]
exclude = ["**/target/**"]
include = [
    "crates/**/*.rs",
    "docs/**/*.md",
    "skills/**/*.md",
]

[vocabulary]

[word]
single = true
